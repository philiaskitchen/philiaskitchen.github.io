name: 發佈網站

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天雪梨時間 00:05 自動重新建置一次（夏令 UTC+11），讓預約的「本週食譜」(featuredFrom) 到日期就自動換上首頁
  schedule:
    - cron: '5 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
